<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Proto — Scène batterie première personne</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#05040a; touch-action:none;
    font-family:'Space Grotesk', system-ui, -apple-system, sans-serif; }
  canvas { display:block; cursor:crosshair; }

  /* vignette cinéma */
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(0,0,5,.55) 100%); }

  #identity { position:fixed; top:22px; left:26px; z-index:6; pointer-events:none;
    color:#cfc8e8; letter-spacing:.02em; }
  #identity .who { font-size:15px; font-weight:600; opacity:.9; }
  #identity .what { font-size:12px; opacity:.5; margin-top:2px; }

  #proto-tag { position:fixed; top:22px; right:26px; z-index:6; pointer-events:none;
    font-size:11px; color:#8f86ad; opacity:.7; border:1px solid rgba(143,134,173,.35);
    padding:4px 9px; border-radius:99px; }

  #crosshair { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.55);
    box-shadow:0 0 8px rgba(255,255,255,.5); z-index:6; pointer-events:none;
    transition:transform .15s ease, background .15s ease; }
  #crosshair.hot { transform:translate(-50%,-50%) scale(1.7); background:#ffd66e; }

  #tooltip { position:fixed; left:50%; bottom:14%; transform:translateX(-50%) translateY(8px);
    z-index:6; pointer-events:none; text-align:center; opacity:0;
    transition:opacity .18s ease, transform .18s ease; }
  #tooltip.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #tooltip .name { font-size:22px; font-weight:600; color:#fff;
    text-shadow:0 2px 18px rgba(0,0,0,.8); }
  #tooltip .cta { font-size:12.5px; color:#b9b0d6; margin-top:4px; }

  #hint { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:6;
    pointer-events:none; font-size:13px; color:#9d94bd; text-align:center;
    transition:opacity 1s ease; text-shadow:0 1px 10px rgba(0,0,0,.8); }
  #hint .snd { font-size:11px; opacity:.6; margin-top:3px; }

  /* écran de redirection */
  #redirect { position:fixed; inset:0; z-index:10; display:flex; align-items:center;
    justify-content:center; background:rgba(4,3,10,0); pointer-events:none;
    transition:background .5s ease; }
  #redirect.on { background:rgba(4,3,10,.9); pointer-events:auto; }
  #redirect .panel { text-align:center; opacity:0; transform:translateY(14px);
    transition:opacity .45s ease .15s, transform .45s ease .15s; }
  #redirect.on .panel { opacity:1; transform:none; }
  #redirect .badge { width:88px; height:88px; border-radius:50%; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700;
    color:#fff; box-shadow:0 0 60px rgba(255,255,255,.15); }
  #redirect .to { color:#9d94bd; font-size:13px; }
  #redirect .dest { color:#fff; font-size:30px; font-weight:600; margin:6px 0 4px; }
  #redirect .url { color:#7d74a0; font-size:13px; }
  #redirect .note { color:#6a628b; font-size:11.5px; margin-top:22px; }
  #redirect button { margin-top:16px; background:none; border:1px solid rgba(185,176,214,.45);
    color:#cfc8e8; font:inherit; font-size:13.5px; padding:10px 22px; border-radius:99px;
    cursor:pointer; transition:background .2s ease; }
  #redirect button:hover, #redirect button:focus-visible { background:rgba(185,176,214,.12); outline:none; }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="identity"><div class="who">Ton Nom</div><div class="what">ingénieur · batteur</div></div>
<div id="proto-tag">prototype</div>
<div id="crosshair"></div>
<div id="tooltip"><div class="name"></div><div class="cta">clique pour jouer un fill</div></div>
<div id="hint">Déplace la souris pour regarder autour de toi<div class="snd">son activé au premier clic</div></div>
<div id="redirect"><div class="panel">
  <div class="badge" id="rBadge"></div>
  <div class="to">redirection vers</div>
  <div class="dest" id="rDest"></div>
  <div class="url" id="rUrl"></div>
  <div class="note">(proto : la vraie version ferait window.location vers la page)</div>
  <button id="rBack" type="button">Revenir sur scène</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============ config des éléments du kit ============ */
/* pos = position monde, r = rayon, d = profondeur du fût */
const KIT = [
  { key:'kick',  kind:'kick',   name:'À propos',  glyph:'moi', color:'#8a63d2', url:'/a-propos',
    pos:[0.02,0.36,-1.06], r:0.30, d:0.42, snd:['kick'] },
  { key:'snare', kind:'drum',   name:'Mes apps',  glyph:'{ }', color:'#e0563a', url:'/apps',
    pos:[-0.28,0.82,-0.52], r:0.19, d:0.15, tilt:0.10, snd:['snare'] },
  { key:'tom1',  kind:'drum',   name:'GitHub',    glyph:'GH',  color:'#4078c0', url:'https://github.com/toi',
    pos:[-0.17,1.07,-0.80], r:0.15, d:0.22, tilt:0.45, snd:['tom',215] },
  { key:'tom2',  kind:'drum',   name:'LinkedIn',  glyph:'in',  color:'#0a8ac2', url:'https://linkedin.com/in/toi',
    pos:[0.18,1.07,-0.81], r:0.165, d:0.24, tilt:0.45, snd:['tom',165] },
  { key:'floor', kind:'drum',   name:'Blog',      glyph:'B',   color:'#3aa06a', url:'/blog',
    pos:[0.57,0.78,-0.46], r:0.21, d:0.34, tilt:0.04, snd:['tom',112] },
  { key:'hihat', kind:'hihat',  name:'CV',        glyph:'CV',  color:'#c2a23a', url:'/cv.pdf',
    pos:[-0.67,1.03,-0.40], r:0.16, snd:['hat'] },
  { key:'crash', kind:'cymbal', name:'Contact',   glyph:'@',   color:'#c2603a', url:'mailto:toi@mail.com',
    pos:[-0.60,1.52,-0.86], r:0.26, tilt:0.55, snd:['crash'] },
  { key:'ride',  kind:'cymbal', name:'Musique',   glyph:'♪',   color:'#b03a8c', url:'/musique',
    pos:[0.64,1.44,-0.92], r:0.30, tilt:0.48, snd:['ride'] },
];
const byKey = {}; KIT.forEach(e => byKey[e.key] = e);

/* ============ rendu ============ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040a);
scene.fog = new THREE.FogExp2(0x05040a, 0.05);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 60);
camera.rotation.order = 'YXZ';
const EYE = 1.35;
camera.position.set(0, EYE, 0.15);

/* ============ textures canvas (peaux + cymbales + logos) ============ */
function drumHeadTexture(el){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128,120,20, 128,128,150);
  g.addColorStop(0,'#f6f0e0'); g.addColorStop(0.8,'#e4dbc4'); g.addColorStop(1,'#c9bfa4');
  x.fillStyle = g; x.fillRect(0,0,256,256);
  x.strokeStyle = 'rgba(120,105,80,.35)'; x.lineWidth = 8;
  x.beginPath(); x.arc(128,128,118,0,7); x.stroke();
  // pastille logo
  x.fillStyle = el.color;
  x.beginPath(); x.arc(128,116,58,0,7); x.fill();
  x.fillStyle = '#fff'; x.textAlign='center'; x.textBaseline='middle';
  x.font = '700 ' + (el.glyph.length > 2 ? 34 : 52) + 'px system-ui';
  x.fillText(el.glyph, 128, 118);
  x.fillStyle = '#57503f'; x.font = '600 24px system-ui';
  x.fillText(el.name, 128, 208);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function cymbalTexture(el){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128,128,10, 128,128,132);
  g.addColorStop(0,'#d8b45e'); g.addColorStop(0.45,'#c09a44'); g.addColorStop(1,'#7c6122');
  x.fillStyle = g; x.fillRect(0,0,256,256);
  x.strokeStyle = 'rgba(60,44,10,.28)';
  for(let r=18; r<128; r+=7){ x.lineWidth = 1 + Math.random(); x.beginPath(); x.arc(128,128,r,0,7); x.stroke(); }
  x.fillStyle = el.color;
  x.beginPath(); x.arc(128,112,50,0,7); x.fill();
  x.fillStyle = '#fff'; x.textAlign='center'; x.textBaseline='middle';
  x.font = '700 ' + (el.glyph.length > 2 ? 30 : 44) + 'px system-ui';
  x.fillText(el.glyph, 128, 114);
  x.fillStyle = '#4a3810'; x.font = '600 23px system-ui';
  x.fillText(el.name, 128, 196);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}

/* ============ construction du kit ============ */
const shellColor = 0x6e1f2e; // rouge bordeaux sparkle
const hitMeshes = [];

function registerHit(el, pos, radius){
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 10, 10),
    new THREE.MeshBasicMaterial({ visible:false })
  );
  m.position.copy(pos);
  m.userData.el = el;
  scene.add(m);
  hitMeshes.push(m);
}
function stand(x, z, h, r){
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(r||0.013, r||0.016, h, 8),
    new THREE.MeshStandardMaterial({ color:0x23252e, metalness:0.85, roughness:0.35 })
  );
  m.position.set(x, h/2, z);
  scene.add(m);
}

KIT.forEach(el => {
  const grp = new THREE.Group();
  const p = new THREE.Vector3(...el.pos);
  grp.position.copy(p);
  el.mats = [];

  if(el.kind === 'drum' || el.kind === 'kick'){
    const shell = new THREE.MeshStandardMaterial({
      color:shellColor, metalness:0.55, roughness:0.32,
      emissive:new THREE.Color(el.color), emissiveIntensity:0 });
    const head = new THREE.MeshStandardMaterial({
      map:drumHeadTexture(el), roughness:0.65,
      emissive:new THREE.Color(el.color), emissiveIntensity:0 });
    const bottom = new THREE.MeshStandardMaterial({ color:0xd8cfb8, roughness:0.7,
      emissive:new THREE.Color(el.color), emissiveIntensity:0 });
    const geo = new THREE.CylinderGeometry(el.r, el.r, el.d, 36);
    const mesh = new THREE.Mesh(geo, [shell, head, bottom]);
    if(el.kind === 'kick'){ mesh.rotation.x = Math.PI/2; } // peau logo face au batteur
    grp.add(mesh);
    if(el.tilt) grp.rotation.x = el.tilt;
    el.mats.push(shell, head, bottom);
    if(el.key === 'snare') stand(p.x, p.z, p.y - el.d/2, 0.012);
    if(el.key === 'floor'){ stand(p.x-0.12, p.z+0.1, p.y - el.d/2, 0.01);
                            stand(p.x+0.14, p.z+0.08, p.y - el.d/2, 0.01); }
  }
  else { // cymbal / hihat
    const top = new THREE.MeshStandardMaterial({
      map:cymbalTexture(el), metalness:0.9, roughness:0.3,
      emissive:new THREE.Color(el.color), emissiveIntensity:0 });
    const side = new THREE.MeshStandardMaterial({ color:0x9a7b30, metalness:0.9, roughness:0.35,
      emissive:new THREE.Color(el.color), emissiveIntensity:0 });
    const geo = new THREE.CylinderGeometry(el.r, el.r, 0.016, 40);
    const mesh = new THREE.Mesh(geo, [side, top, side]);
    grp.add(mesh);
    if(el.kind === 'hihat'){
      const under = new THREE.Mesh(new THREE.CylinderGeometry(el.r*0.97, el.r*0.97, 0.014, 40),
        new THREE.MeshStandardMaterial({ color:0xa8863a, metalness:0.9, roughness:0.4 }));
      under.position.y = -0.035; grp.add(under);
      grp.rotation.x = 0.14;
      stand(p.x, p.z, p.y - 0.05, 0.011);
    } else {
      grp.rotation.x = el.tilt || 0.5;
      stand(p.x*0.92, p.z + 0.12, p.y - 0.06, 0.012);
    }
    el.mats.push(top, side);
  }

  el.node = grp;
  el.baseRotX = grp.rotation.x;
  el.glow = 0; el.flash = 0;
  scene.add(grp);
  registerHit(el, p, el.r + 0.09);
});

/* ============ scène : sol, foule, lumières ============ */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color:0x0b0a12, metalness:0.6, roughness:0.35 })
);
floor.rotation.x = -Math.PI/2; scene.add(floor);

// retours de scène (wedges)
[[-1.5,-1.9,0.5],[1.5,-1.9,-0.5]].forEach(w => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.55,0.35,0.4),
    new THREE.MeshStandardMaterial({ color:0x14141c, roughness:0.8 }));
  m.position.set(w[0], 0.17, w[1]); m.rotation.y = w[2]; scene.add(m);
});

// foule : silhouettes instanciées
const IS_COARSE = matchMedia('(pointer: coarse)').matches;
const CROWD_N = IS_COARSE ? 140 : 260;
const crowdGeo = new THREE.BoxGeometry(0.34, 1, 0.26);
const crowdMat = new THREE.MeshStandardMaterial({ color:0x0d0e18, roughness:0.95 });
const crowd = new THREE.InstancedMesh(crowdGeo, crowdMat, CROWD_N);
crowd.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(crowd);
const cX=[], cZ=[], cH=[], cPh=[];
for(let i=0;i<CROWD_N;i++){
  cX.push((Math.random()-0.5)*15);
  cZ.push(-3.6 - Math.random()*10.5);
  cH.push(1.35 + Math.random()*0.55);
  cPh.push(Math.random()*Math.PI*2);
}
const dummy = new THREE.Object3D();
let crowdEnergy = 0.45;

// lumières de téléphones
const phoneN = Math.floor(CROWD_N*0.3);
const phonePos = new Float32Array(phoneN*3);
for(let i=0;i<phoneN;i++){
  const j = Math.floor(Math.random()*CROWD_N);
  phonePos[i*3] = cX[j] + (Math.random()-0.5)*0.3;
  phonePos[i*3+1] = -0.55 + cH[j] + 0.25 + Math.random()*0.25;
  phonePos[i*3+2] = cZ[j];
}
const phoneGeo = new THREE.BufferGeometry();
phoneGeo.setAttribute('position', new THREE.BufferAttribute(phonePos, 3));
const phoneMat = new THREE.PointsMaterial({ color:0xffe6b8, size:0.06, transparent:true, opacity:0.85 });
scene.add(new THREE.Points(phoneGeo, phoneMat));

// lumières
scene.add(new THREE.AmbientLight(0x191430, 0.9));
const key = new THREE.PointLight(0xffd9b0, 0.85, 9); key.position.set(0.4, 2.6, 0.9); scene.add(key);
const crowdLight = new THREE.PointLight(0x2c2c58, 0.7, 22); crowdLight.position.set(0, 4, -8); scene.add(crowdLight);

const spots = [];
function addSpot(color, x){
  const s = new THREE.SpotLight(color, 1.5, 30, 0.5, 0.55, 1.2);
  s.position.set(x, 6.2, -6.5);
  s.target.position.set(0, 0.9, -0.7);
  scene.add(s); scene.add(s.target); spots.push(s);
  // faisceau volumétrique fake
  const dir = new THREE.Vector3().subVectors(s.position, s.target.position);
  const len = dir.length();
  const beam = new THREE.Mesh(
    new THREE.ConeGeometry(2.4, len, 24, 1, true),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.055,
      blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide })
  );
  beam.position.copy(s.position).add(s.target.position).multiplyScalar(0.5);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  scene.add(beam);
  return beam;
}
const beams = [ addSpot(0xd23a8c, -3.2), addSpot(0x3a5cd2, 3.2) ];

/* ============ contrôles regard ============ */
let tYaw = 0, tPitch = -0.30, yaw = 0, pitch = -0.30, shake = 0;
const hint = document.getElementById('hint');
let moved = false;
function look(cx, cy){
  const mx = (cx/innerWidth)*2 - 1;
  const my = -((cy/innerHeight)*2 - 1);
  tYaw = -mx * 0.85;
  tPitch = Math.max(-0.72, Math.min(0.14, -0.30 + my*0.42));
  if(!moved){ moved = true; setTimeout(()=>hint.style.opacity = 0, 2500); }
}
addEventListener('mousemove', e => look(e.clientX, e.clientY));
addEventListener('touchmove', e => { const t = e.touches[0]; look(t.clientX, t.clientY); }, { passive:true });

/* ============ raycast + survol ============ */
const raycaster = new THREE.Raycaster();
const CENTER = new THREE.Vector2(0,0);
let hovered = null, state = 'idle';
const tooltip = document.getElementById('tooltip');
const tooltipName = tooltip.querySelector('.name');
const crosshair = document.getElementById('crosshair');

function updateHover(){
  raycaster.setFromCamera(CENTER, camera);
  const hits = raycaster.intersectObjects(hitMeshes, false);
  const el = hits.length ? hits[0].object.userData.el : null;
  if(el !== hovered){
    hovered = el;
    if(el){
      tooltipName.textContent = el.name;
      tooltip.classList.add('on'); crosshair.classList.add('hot');
      renderer.domElement.style.cursor = 'pointer';
    } else {
      tooltip.classList.remove('on'); crosshair.classList.remove('hot');
      renderer.domElement.style.cursor = 'crosshair';
    }
  }
}

/* ============ audio (Web Audio, synthèse) ============ */
let actx = null, master = null, noiseBuf = null;
function initAudio(){
  if(actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = actx.createDynamicsCompressor();
  master = actx.createGain(); master.gain.value = 0.85;
  master.connect(comp); comp.connect(actx.destination);
  const n = actx.sampleRate * 2;
  noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
}
function envGain(t, peak, dec){
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
  g.connect(master); return g;
}
function noise(t, dur){
  const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  s.start(t); s.stop(t + dur + 0.1); return s;
}
function filt(type, f, q){ const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; if(q) fl.Q.value = q; return fl; }

const SND = {
  kick(t, v){
    const o = actx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
    o.connect(envGain(t, 0.95*v, 0.30)); o.start(t); o.stop(t + 0.45);
  },
  tom(t, v, f){
    const o = actx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f*0.55, t + 0.28);
    o.connect(envGain(t, 0.8*v, 0.42)); o.start(t); o.stop(t + 0.55);
    const s = noise(t, 0.05); const hp = filt('highpass', 1000);
    s.connect(hp); hp.connect(envGain(t, 0.12*v, 0.04));
  },
  snare(t, v){
    const s = noise(t, 0.25); const hp = filt('highpass', 1600);
    s.connect(hp); hp.connect(envGain(t, 0.7*v, 0.17));
    const o = actx.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(196, t);
    o.connect(envGain(t, 0.28*v, 0.08)); o.start(t); o.stop(t + 0.15);
  },
  hat(t, v){
    const s = noise(t, 0.1); const hp = filt('highpass', 8200);
    s.connect(hp); hp.connect(envGain(t, 0.35*v, 0.05));
  },
  crash(t, v){
    const s = noise(t, 1.6); const hp = filt('highpass', 4200);
    s.connect(hp); hp.connect(envGain(t, 0.5*v, 1.35));
  },
  ride(t, v){
    const o = actx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(620, t);
    o.connect(envGain(t, 0.22*v, 0.6)); o.start(t); o.stop(t + 0.8);
    const s = noise(t, 0.4); const hp = filt('highpass', 6800);
    s.connect(hp); hp.connect(envGain(t, 0.18*v, 0.3));
  },
  cheer(t){
    const s = noise(t, 2.4); const lp = filt('lowpass', 850, 0.6);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.15, t + 0.45);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    s.connect(lp); lp.connect(g); g.connect(master);
  }
};
function playKey(key, t, v){
  const el = byKey[key]; const s = el.snd;
  SND[s[0]](t, v, s[1]);
}

/* ============ fill + planification visuelle ============ */
let pendingHits = [];
function perfAt(audioT){ return (audioT - actx.currentTime)*1000 + performance.now(); }

function buildFill(el){
  const q = 0.107; // double-croches ~140bpm
  const F = [
    { dt:0,    key:'snare', v:0.85 }, { dt:q,   key:'snare', v:0.55 },
    { dt:2*q,  key:'tom1',  v:0.80 }, { dt:3*q, key:'tom2',  v:0.65 },
    { dt:4*q,  key:'tom2',  v:0.55 }, { dt:5*q, key:'floor', v:0.90 },
    { dt:6*q,  key:'kick',  v:0.95 },
    { dt:7*q,  key:'kick',  v:1.0 },
    { dt:7*q,  key: el.key === 'kick' ? 'crash' : el.key, v:1.0 },
  ];
  if(el.key !== 'crash' && el.key !== 'ride') F.push({ dt:7*q, key:'crash', v:0.75 });
  return F;
}

const redirectEl = document.getElementById('redirect');
function showRedirect(el){
  document.getElementById('rBadge').textContent = el.glyph;
  document.getElementById('rBadge').style.background = el.color;
  document.getElementById('rDest').textContent = el.name;
  document.getElementById('rUrl').textContent = el.url;
  redirectEl.classList.add('on');
  state = 'redirect';
  // vraie version : setTimeout(() => location.href = el.url, 600);
}
document.getElementById('rBack').addEventListener('click', e => {
  e.stopPropagation();
  redirectEl.classList.remove('on');
  setTimeout(() => { state = 'idle'; }, 350);
});

addEventListener('click', () => {
  if(state !== 'idle' || !hovered) return;
  initAudio();
  if(actx.state === 'suspended') actx.resume();
  const el = hovered;
  state = 'fill';
  const t0 = actx.currentTime + 0.06;
  const fill = buildFill(el);
  fill.forEach(h => {
    playKey(h.key, t0 + h.dt, h.v);
    pendingHits.push({ at:perfAt(t0 + h.dt), key:h.key, v:h.v });
  });
  pendingHits.sort((a,b) => a.at - b.at);
  SND.cheer(t0 + 0.75);
  setTimeout(() => showRedirect(el), 1500);
});

/* ============ boucle ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const now = performance.now();

  // frappes planifiées -> flash + shake
  while(pendingHits.length && pendingHits[0].at <= now){
    const h = pendingHits.shift();
    const el = byKey[h.key];
    el.flash = 1;
    shake = Math.min(1, shake + h.v*0.4);
    crowdEnergy = Math.min(1, crowdEnergy + 0.12);
  }

  // caméra
  yaw += (tYaw - yaw)*0.075;
  pitch += (tPitch - pitch)*0.075;
  shake *= 0.88;
  camera.rotation.y = yaw + (Math.random()-0.5)*shake*0.05;
  camera.rotation.x = pitch + (Math.random()-0.5)*shake*0.05;
  camera.position.y = EYE + Math.sin(t*1.3)*0.006 + (Math.random()-0.5)*shake*0.02;

  // survol + états visuels du kit
  updateHover();
  KIT.forEach(el => {
    const target = (el === hovered && state === 'idle') ? 1 : 0;
    el.glow += (target - el.glow)*0.12;
    el.flash *= 0.90;
    const it = el.glow*0.55 + el.flash*1.7;
    el.mats.forEach(m => m.emissiveIntensity = it);
    const s = 1 + el.glow*0.035 + el.flash*0.05;
    el.node.scale.set(s, s*(1 - el.flash*0.10), s);
    if(el.kind === 'cymbal' || el.kind === 'hihat')
      el.node.rotation.x = el.baseRotX + Math.sin(t*38)*el.flash*0.07;
  });

  // foule
  crowdEnergy += (0.45 - crowdEnergy)*0.01;
  for(let i=0;i<CROWD_N;i++){
    const bob = Math.sin(t*2.1 + cPh[i]) * 0.035 * crowdEnergy;
    dummy.position.set(cX[i], -0.55 + cH[i]/2 + bob, cZ[i]);
    dummy.scale.set(1, cH[i], 1);
    dummy.rotation.y = Math.sin(cPh[i])*0.3;
    dummy.updateMatrix();
    crowd.setMatrixAt(i, dummy.matrix);
  }
  crowd.instanceMatrix.needsUpdate = true;
  phoneMat.opacity = 0.65 + Math.sin(t*2.7)*0.2;
  phoneMat.size = 0.05 + Math.sin(t*3.3)*0.012;

  // lumières vivantes
  spots[0].intensity = 1.4 + Math.sin(t*1.7)*0.4;
  spots[1].intensity = 1.4 + Math.sin(t*1.7 + 2.4)*0.4;
  beams[0].material.opacity = 0.045 + Math.sin(t*1.7)*0.02;
  beams[1].material.opacity = 0.045 + Math.sin(t*1.7 + 2.4)*0.02;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
})();
</script>
